name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          # Track the uv version that maintains uv.lock, like the Dockerfile.
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest
