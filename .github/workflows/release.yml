name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Any tag matching the trigger would otherwise publish whatever version pyproject.toml holds
      - name: Check that the tag matches the project version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section, up to the next release heading or the link definitions; ### becomes ##.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { sub(/^### /, "## "); print }
          ' CHANGELOG.md | sed -e '/./,$!d' > section.md
          if [ ! -s section.md ]; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
          { printf "# What's Changed\n\n"; cat section.md; } > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted Publishing: PyPI trusts this workflow, no token is stored
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          # Track the uv version that maintains uv.lock, like the Dockerfile.
          version: "0.13.8"
          python-version: "3.14"

      - run: uv build

      - run: uv publish --trusted-publishing always
