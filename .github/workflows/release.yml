name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section, up to the next release heading or the link definitions; ### becomes ##.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { sub(/^### /, "## "); print }
          ' CHANGELOG.md | sed -e '/./,$!d' > section.md
          if [ ! -s section.md ]; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
          { printf "# What's Changed\n\n"; cat section.md; } > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
