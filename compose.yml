services:
  baycone:
    container_name: baycone
    image: theobaldik/baycone:0.6.0
    # Host uid:gid that owns the mounted media. 1000:1000 is the image default;
    # change it if `id -u` / `id -g` on the host differ.
    user: "1000:1000"
    # Comes back after a crash or a reboot; interrupted files are picked up again
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ffmpeg parses untrusted media: no network, no privilege escalation, and
    # nothing writable beyond the mounts and the temp dir
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    build:
      context: .
      tags:
        - "theobaldik/baycone:latest"
        - "theobaldik/baycone:0.6"
        - "theobaldik/baycone:0.6.0"
    environment:
      # Override these to change paths without rebuilding the image.
      BAYCONE_CONFIG: /config/config.yml
      BAYCONE_LOCATIONS: /locations
    # Copy config.yml.example to config/config.yml before the first start, and
    # keep machine-specific paths in a compose.override.yml (git-ignored) instead
    # of editing the mounts below. The config directory (not the file) is mounted,
    # so edits are seen by the running service and the config is hot-reloaded.
    volumes:
      - ./config:/config:ro
      - /your/movies:/locations/movies
      - /your/tv-shows:/locations/tv-shows
