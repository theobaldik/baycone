[project]
name = "baycone"
version = "0.1.0"
description = "Media pipeline for self-hosted libraries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "theobaldik" },
]
maintainers = [
    { name = "theobaldik" },
]
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.12.0",
    "pyyaml>=6.0.3",
]

[tool.black]
line-length = 120
target-version = ['py314']

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

